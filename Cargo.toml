[workspace]
resolver = "2"
members = ["crates/otpuska-core", "crates/otpuska-gui"]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
otpuska-core = { path = "crates/otpuska-core" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Keep target/ small: line tables for our crates (readable backtraces),
# no debug info for dependencies (most of the size).
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
