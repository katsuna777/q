name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Calculation core, database, import, printing and the UI logic — on both target systems.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  macos:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Build Otpuska.app (Apple Silicon + Intel)
        run: UNIVERSAL=1 packaging/macos/bundle.sh
      - name: Disk image
        run: packaging/macos/make-dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Otpuska-macos
          path: dist/Otpuska-*-macos.dmg
          if-no-files-found: error

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Version
        id: v
        shell: bash
        run: echo "version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)" >> "$GITHUB_OUTPUT"
      - run: cargo build --release -p otpuska-gui
      - name: Portable zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/Otpuska | Out-Null
          Copy-Item target/release/otpuska.exe dist/Otpuska/Otpuska.exe
          Compress-Archive -Path dist/Otpuska -DestinationPath "dist/Otpuska-${{ steps.v.outputs.version }}-windows-x64-portable.zip" -Force
      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          }
          & $iscc "/DAppVersion=${{ steps.v.outputs.version }}" packaging\windows\otpuska.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
      - uses: actions/upload-artifact@v4
        with:
          name: Otpuska-windows
          path: |
            dist/Otpuska-*-windows-x64-setup.exe
            dist/Otpuska-*-windows-x64-portable.zip
          if-no-files-found: error

  # A tag like v1.0.0 publishes the release with both builds attached.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - run: ls -la artifacts
      - uses: softprops/action-gh-release@v2
        with:
          name: Отпуска ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: artifacts/*
          fail_on_unmatched_files: true
